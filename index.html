<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Time</title>
<style>
  :root{
    --bg:#0b0d14;
    --card:#171b2a;
    --line:#2a3148;
    --text:#eef2ff;
    --sub:#9aa7c4;
    --lime:#a7d85c;
    --green:#22c55e;
    --green-d:#16a34a;
    --red:#ef4444;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  .app{max-width:640px;margin:0 auto;padding:20px 16px 48px}
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px;
  }
  h1.logo{font-size:22px;letter-spacing:.5px;color:var(--lime);margin:0;font-weight:800}
  h1.logo span{color:var(--text);font-weight:600}
  .btn{
    padding:10px 14px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;
  }
  .btn-ghost{background:transparent;color:var(--sub);border:1px solid var(--line)}
  .btn-ghost:hover{background:var(--bg2);color:var(--text)}
  .btn-ghost.danger:hover{color:var(--red);border-color:var(--red);background:rgba(239,68,68,.10)}
  .view{display:none}
  .view.active{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .card h2{font-size:18px;margin:0 0 4px;color:var(--text)}
  .card .sub{color:var(--sub);font-size:13px;margin:0 0 10px}

  .quiz-title{
    font-size:15px;color:var(--text);background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;
  }
  .quiz-title:hover{background:var(--bg2)}

  .qblock{
    border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--bg2);
  }
  .qnum{font-size:12px;color:var(--sub);letter-spacing:.3px;font-weight:700}
  .qtext{
    width:100%;margin-top:6px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);
    color:var(--text);font-size:15px;font-family:inherit;resize:vertical;outline:none;transition:border .15s;
  }
  .qtext:focus{border-color:var(--lime)}

  .choice{
    display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg2);font-size:14px;margin-bottom:6px;
  }
  .choice input.text{flex:1;margin-top:0;padding:8px 10px}
  .choice .correct-toggle{
    font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;border:1px solid var(--line);
    background:var(--bg2);color:var(--sub);cursor:pointer;white-space:nowrap;transition:.15s;
  }
  .choice .correct-toggle.on{background:var(--green);color:#0b0d14;border-color:var(--green);}
  .choice .rm{
    border:none;background:transparent;color:var(--sub);cursor:pointer;padding:4px;border-radius:6px;transition:.15s;font-size:14px;
  }
  .choice .rm:hover{color:var(--red);background:rgba(239,68,68,.12)}
  .choice .hint{font-size:11px;color:var(--sub);margin-top:4px}

  .add-row{display:flex;justify-content:flex-start;margin-top:4px}
  .add-row .btn{flex:1}
  .btn-row{display:flex;gap:8px;margin-top:14px}
  .btn-row .btn{flex:1}

  .msg{font-size:13px;color:var(--red);margin-top:10px;text-align:center;display:none}
  .msg.show{display:block}

  .quiz-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .progress{font-size:13px;color:var(--sub);letter-spacing:.3px}
  .qtext{font-size:21px;font-weight:800;line-height:1.4;margin:0 0 18px;color:var(--text);text-align:center}

  .answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .ans{
    padding:12px 14px;border-radius:10px;text-align:left;font-size:14px;cursor:pointer;
    border:1px solid var(--line);background:var(--bg2);transition:.15s;
  }
  .ans.select{border-color:var(--green);background:#16241a}
  .ans.wrong{background:#16241a;border-color:var(--green);color:var(--green)}
  .ans.wrong .mark{background:var(--green);color:#0b0d14;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px}
  .ans .letter{font-size:12px;font-weight:800;color:var(--sub);display:block;margin-bottom:2px}
  .ans .txt{font-weight:600}
  .ans .mark{vertical-align:middle}

  .reveal-row{display:flex;gap:8px;margin-top:18px}
  .reveal-row .btn{flex:1}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
    background:#16241a;border:1px solid var(--green);color:var(--green);
    padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:480px){
    .choice{grid-template-columns:1fr auto;}
    .choice .rm{display:none;}
    .qtext{font-size:16px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1><span class="logo">Q</span>UIZ<span class="logo">TIME</span></h1>
    <button class="btn btn-ghost" id="resetAll" style="padding:6px 10px;font-size:12px" title="Delete all quizzes">Clear all quizzes</button>
  </header>

  <section id="edit-view" class="view active">
    <div id="quizList"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="addQuiz">+ Add quiz</button>
      <button class="btn btn-ghost" id="startBtn" disabled>Start quiz</button>
    </div>
    <div class="msg" id="msg"></div>
  </section>

  <section id="quiz-view" class="view">
    <div class="quiz-card">
      <div class="quiz-head">
        <div class="progress">Question <span id="qnnum">1</span> of <span id="qncount">1</span></div>
        <button class="btn btn-ghost" id="backBtn" style="padding:6px 10px;font-size:12px">Back</button>
      </div>
      <h2 class="qtext" id="qtext"></h2>
      <div class="answers" id="answers"></div>
      <div class="reveal-row">
        <button class="btn btn-primary" id="checkBtn">Check answer</button>
        <button class="btn btn-ghost" id="nextBtn" disabled>Next →</button>
      </div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "quiztime_quizzes_v1";
  var SAMPLE = {
    title: "Astronomy Quick",
    questions: [
      { text: "What is the closest star to Planet Earth?", choices: [
          { text: "Proxima Centauri", correct: false },
          { text: "The Sun", correct: true },
          { text: "Alpha Centauri", correct: false },
          { text: "Sirius", correct: false }
        ]
      }
    ]
  };

  var store = {
    load: function(){
      try{
        var raw = localStorage.getItem(STORAGE_KEY);
        var t = JSON.parse(raw);
        if(!t || !Array.isArray(t)) return [];
        return t.map(function(qz){
          var questions = (qz.questions||[]).map(function(q){
            if(!q || typeof q !== 'object') return q;
            var choices = (q.choices||[]).map(function(c){
              if(typeof c === 'string') return { text: c, correct: false };
              return c;
            });
            var ci = q.correct;
            if(typeof ci === 'number' && ci >= 0 && ci < choices.length){
              choices[ci] = Object.assign({}, choices[ci], { correct: true });
            }
            return { text: q.text || "", choices: choices };
          });
          return { title: qz.title || "Untitled", questions: questions };
        });
      }catch(e){ return []; }
    },
    save: function(list){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); toast("Saved"); }
      catch(e){ toast("Could not save"); }
    }
  };

  var state = {
    quizzes: store.load(),
    editIndex: -1,
    qn: 0,
    selected: null,
    results: null
  };

  function $(id){ return document.getElementById(id); }
  function toast(msg){
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove("show"); }, 1600);
  }
  function currentQuiz(){ return state.quizzes[state.editIndex]; }

  function quizComplete(qz){
    return (qz.questions||[]).some(function(q){
      return q.text.trim() && (q.choices||[]).length >= 2 && (q.choices||[]).filter(function(c){ return c.correct; }).length === 1;
    });
  }

  function saveAndUpdate(){ store.save(state.quizzes); renderEdit(); updateStart(); }

  // ---------------- EDIT VIEW ----------------
  function renderEdit(){
    var box = $("quizList");
    if(state.quizzes.length === 0){
      box.innerHTML = '<div class="empty">No quizzes yet. Add one below.</div>';
      $("startBtn").disabled = true;
      $("msg").classList.remove("show");
      return;
    }
    box.innerHTML = "";
    state.quizzes.forEach(function(qz, qi){
      var card = document.createElement("div");
      card.className = "card";
      card.style.marginBottom = "14px";

      var title = document.createElement("input");
      title.className = "quiz-title";
      title.placeholder = "Quiz title";
      title.value = qz.title || "";
      title.addEventListener("input", function(){ qz.title = title.value; saveAndUpdate(); });

      (qz.questions||[]).forEach(function(q, qi2){
        var qblock = document.createElement("div");
        qblock.className = "qblock";

        var qk = document.createElement("div");
        qk.className = "qnum";
        qk.textContent = "Question " + (qi2+1);

        var qtext = document.createElement("input");
        qtext.className = "qtext";
        qtext.placeholder = "Type the question";
        qtext.value = q.text || "";
        qtext.addEventListener("input", function(){ q.text = qtext.value; saveAndUpdate(); });

        qblock.appendChild(qk);
        qblock.appendChild(qtext);

        (q.choices||[]).forEach(function(c, ci){
          var choice = document.createElement("div");
          choice.className = "choice";
          choice.dataset.index = ci;

          var ctext = document.createElement("input");
          ctext.className = "text";
          ctext.placeholder = "Choice " + (ci+1);
          ctext.value = c.text || "";
          ctext.addEventListener("input", function(){ c.text = ctext.value; saveAndUpdate(); });

          var tog = document.createElement("button");
          tog.className = "correct-toggle" + (c.correct ? " on" : "");
          tog.textContent = c.correct ? "✓ Correct" : "Mark as correct";
          tog.addEventListener("click", function(){
            q.choices.forEach(function(x){ x.correct = false; });
            c.correct = true;
            saveAndUpdate();
          });

          var rm = document.createElement("button");
          rm.className = "rm";
          rm.innerHTML = "✕";
          rm.title = "Remove choice";
          rm.addEventListener("click", function(){
            q.choices.splice(ci, 1);
            saveAndUpdate();
            renderEdit();
          });

          choice.appendChild(ctext);
          choice.appendChild(tog);
          choice.appendChild(rm);
          qblock.appendChild(choice);
        });

        var addChoice = document.createElement("button");
        addChoice.className = "btn btn-ghost";
        addChoice.style.width = "100%";
        addChoice.style.padding = "6px";
        addChoice.textContent = "+ Add choice";
        addChoice.addEventListener("click", function(){
          if(!qz.questions[qi2].choices) qz.questions[qi2].choices = [];
          qz.questions[qi2].choices.push({ text: "", correct: false });
          saveAndUpdate();
          renderEdit();
        });

        var rmQ = document.createElement("button");
        rmQ.className = "rm";
        rmQ.style.width = "100%";
        rmQ.style.padding = "6px";
        rmQ.innerHTML = "Remove question";
        rmQ.title = "Remove this question";
        rmQ.addEventListener("click", function(){
          qz.questions.splice(qi2, 1);
          saveAndUpdate();
          renderEdit();
        });

        qblock.appendChild(addChoice);
        qblock.appendChild(rmQ);
        card.appendChild(qblock);
      });

      var addQ = document.createElement("button");
      addQ.className = "btn btn-ghost";
      addQ.style.width = "100%";
      addQ.style.padding = "6px";
      addQ.textContent = "+ Add question";
      addQ.addEventListener("click", function(){
        qz.questions.push({ text: "", choices: [{ text: "", correct: false }] });
        saveAndUpdate();
        renderEdit();
      });

      var rmQuiz = document.createElement("button");
      rmQuiz.className = "rm";
      rmQuiz.style.width = "100%";
      rmQuiz.style.padding = "6px";
      rmQuiz.innerHTML = "Delete this quiz";
      rmQuiz.title = "Delete this quiz";
      rmQuiz.addEventListener("click", function(){
        if(state.quizzes.length > 1 && !confirm("Delete this quiz? This can't be undone.")) return;
        if(state.quizzes.length === 1 && !confirm("Delete this quiz? This can't be undone.")) return;
        state.quizzes.splice(qi, 1);
        if(state.editIndex === qi) state.editIndex = state.quizzes.length - 1;
        saveAndUpdate();
        renderEdit();
      });

      card.appendChild(title);
      card.appendChild(addQ);
      card.appendChild(rmQuiz);
      box.appendChild(card);
    });
    updateStart();
  }

  function updateStart(){
    var msg = $("msg");
    var enabled = quizComplete(state.quizzes[state.editIndex]);
    $("startBtn").disabled = !enabled;
    msg.classList.remove("show");
    if(state.quizzes.length === 0){
      msg.textContent = "Add a quiz first.";
      msg.classList.add("show");
    } else if(!enabled){
      msg.textContent = "A complete question needs: a question, at least 2 choices, and one marked as correct.";
      msg.classList.add("show");
    }
  }

  // ---------------- QUIZ VIEW ----------------
  function startQuiz(){
    var qz = currentQuiz();
    if(!quizComplete(qz)){
      toast("Add a question, at least 2 choices, and mark one as correct first.");
      return;
    }
    state.qn = 0;
    state.selected = null;
    state.results = [];
    showQuizView();
    showQuestion();
  }

  function showQuizView(){
    $("edit-view").classList.remove("active");
    $("quiz-view").classList.add("active");
  }
  function showEditView(){
    $("quiz-view").classList.remove("active");
    $("edit-view").classList.add("active");
  }

  function showQuestion(){
    var qz = currentQuiz();
    var qs = qz.questions;
    $("qnnum").textContent = state.qn + 1;
    $("qncount").textContent = qs.length;
    $("qtext").textContent = qs[state.qn].text;
    renderAnswers();
  }

  function renderAnswers(){
    var qz = currentQuiz();
    var qs = qz.questions;
    var wrap = $("answers");
    wrap.innerHTML = "";
    state.results = state.results || [];
    var rec = state.results[state.qn];
    state.selected = rec ? rec.selected : null;
    var correctIndex = qs[state.qn].choices.findIndex(function(c){ return c.correct; });
    var hasChecked = rec !== undefined && rec.correct !== null;

    qs[state.qn].choices.forEach(function(c, ci){
      var div = document.createElement("div");
      div.className = "ans";
      div.addEventListener("click", function(){ state.selected = ci; });

      if(state.selected !== null) div.classList.add("select");

      if(hasChecked){
        if(ci === correctIndex){
          div.classList.add("correct");
          div.innerHTML = '<span class="letter">' + String.fromCharCode(65 + ci) + '</span><span class="txt">✓ ' + c.text + '</span><span class="mark">correct</span>';
        } else {
          div.classList.add("wrong");
          div.innerHTML = '<span class="letter">' + String.fromCharCode(65 + ci) + '</span><span class="txt">✗ ' + c.text + '</span><span class="mark">' + (state.selected === ci ? "your pick" : "not the answer") + '</span>';
        }
      } else {
        div.innerHTML = '<span class="letter">' + String.fromCharCode(65 + ci) + '</span><span class="txt">' + c.text + '</span><span class="mark"></span>';
      }
      wrap.appendChild(div);
    });

    $("checkBtn").onclick = checkAnswer;
    $("nextBtn").onclick = nextQuestion;
    $("nextBtn").disabled = state.results[state.qn] === undefined;
    $("backBtn").onclick = backToEdit;
  }

  function checkAnswer(){
    var qz = currentQuiz();
    var qs = qz.questions;
    var chosen = state.selected;
    var correctIndex = qs[state.qn].choices.findIndex(function(c){ return c.correct; });

    if(chosen === null){
      toast("Pick an answer first.");
      return;
    }
    if(state.results[state.qn]){ toast("Already checked this one."); return; }
    state.results[state.qn] = { selected: chosen, correct: correctIndex };
    showQuestion();
    if(state.qn === qs.length - 1){
      $("nextBtn").textContent = "Finish";
      toast("Quiz complete!");
    }
  }

  function nextQuestion(){
    var qs = currentQuiz().questions;
    if(state.qn + 1 >= qs.length){
      toast("Quiz complete!");
      showEditView();
      return;
    }
    state.qn++;
    state.selected = null;
    showQuestion();
  }

  function backToEdit(){
    state.qn = 0;
    state.selected = null;
    showEditView();
  }

  // ---------------- Actions ----------------
  function addQuiz(){
    state.quizzes.push({ title: "New quiz", questions: [{ text: "", choices: [{ text: "", correct: false }] }] });
    state.editIndex = state.quizzes.length - 1;
    saveAndUpdate();
    renderEdit();
    var cards = $("quizList").children;
    if(cards.length) cards[cards.length-1].querySelector("input.qtext").focus();
  }

  function resetAll(){
    if(state.quizzes.length === 0) return;
    if(!confirm("Delete all quizzes and start fresh?")) return;
    state.quizzes = [];
    state.editIndex = -1;
    store.save(state.quizzes);
    renderEdit();
    $("msg").classList.remove("show");
    toast("Removed all quizzes");
  }

  // ---------------- Init ----------------
  function init(){
    if(state.quizzes.length === 0){
      state.quizzes.push(JSON.parse(JSON.stringify(SAMPLE)));
    }
    state.editIndex = 0;
    renderEdit();
    $("addQuiz").onclick = addQuiz;
    $("startBtn").onclick = startQuiz;
    $("resetAll").onclick = resetAll;
    $("backBtn").onclick = backToEdit;
  }

  init();
})();
</script>
</body>
</html>
